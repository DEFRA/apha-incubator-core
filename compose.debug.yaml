# Starts the Node services with --inspect-brk: each waits for a debugger to attach
# before running. Attach to localhost:9229 (backend), localhost:9230 (frontend)
# or localhost:9231 (ingestion).
services:
  apha-risk-insights-backend:
    command: npm run dev:debug

  apha-risk-insights-frontend:
    command: npm run dev:debug

  apha-insights-ingestion:
    command: npm run dev:debug
